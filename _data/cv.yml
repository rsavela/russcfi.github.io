    Overview:
      - bullet: "Senior AI/ML and Cloud Architect with 15+ years of experience advising Fortune 500 customers, driving
          large-scale technology transformation. Proven track record of supporting eight-figure revenue impact through strategic
          technical leadership, AI/ML innovation, and secure, scalable architectures. Trusted advisor to executive stakeholders
          with deep expertise in cloud-native systems and enterprise modernization."
    Experience:
      - company: TD SYNNEX
        position: Field Solutions Architect
        date:
        start_date: 2026-05
        end_date: present
        location: Clearwater, FL
        summary: Automation, Continuous Integration, and Continuous Delivery Specialist.
        highlights:
          - Led technical enablement efforts for partner sellers, focusing on DevOps best practices and cloud-native architectures.
          - Conference speaker, and frequent hosts of technical webinars and workshops.
          - Obtained 13 IBM Proficiencies, including 3 Advanced Level 4 Badges.
          - Developed and delivered hands-on enablement for CI/CD pipelines, infrastructure as code (IaC), and container orchestration.

      - company: Amazon Web Services
        position: Senior Solutions Architect
        date:
        start_date: 2017-10
        end_date: 2024-10
        location: Saint Petersburg, FL
        summary: Technical lead, growing sales to a strategic multi-billion dollar supplier, identifying new
          technology applications and partner opportunities. As a strategic advisor, drove cloud adoption and
          digital transformation, supporting an increase in revenue of over $100M during tenure.
        highlights:
          - Led a Computer Vision use case from inception through POC and adoption, becoming the largest worldwide
            deployment of an AWS service within 12 months, and growing AI/ML revenue 20% above goal.
          - Delivered hands-on enablement for CI/CD pipelines, infrastructure as code (IaC), and container orchestration.
          - Collaborated with AWS partners to accelerate workload adoption, scaling cloud projects across several lines of business.
          - Increased scale as a 5-year member of the AI/ML Technical Field Community, mentoring new team members
            and assisting account teams with technical deep dives.
          - Maintained multiple industry certifications.
      - company: Dell Technologies
        position: Systems Integration Senior Consultant
        date:
        start_date: 2007-09
        end_date: 2017-09
        location: Saint Petersburg, FL
        summary: Provided design and delivery of technical solutions for clients, in both pre-sales and delivery roles.
          Specialized in Linux systems integration, automation, and performance tuning for large-scale enterprise deployments.
        highlights:
          - Designed and deployed automation pipelines using Ansible, Puppet, Kickstart, and PXE boot.
          - Led large-scale Linux integrations with Active Directory and custom enterprise tooling, consistently
            reducing deployment times by 20-30%.
          - Implemented performance tuning for Oracle RAC and clustered systems, routinely improving throughput by 30-50%.
          - Provided pre-sales technical leadership for migration and modernization projects, securing multimillion-dollar contracts.
